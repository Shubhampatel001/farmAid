spring:
  datasource:
    url: jdbc:h2:mem:farmaid;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=DATE,DATA,VALUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    show-sql: false
    # H2 reports MySQL LONGTEXT as VARCHAR, so strict validation only runs against real MySQL.
    hibernate:
      ddl-auto: none

