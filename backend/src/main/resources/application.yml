spring:
  application:
    name: farmaid
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Lets local runs pick up the repo-level .env (KEY=VALUE lines) without exporting variables.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/farmaid}
    username: ${DB_USER:farmaid}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
app:
  jwt:
    # Dev-only fallback so the app starts without a .env. Override in every real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1mYXJtYWlkLWRldi1rZXktMjU2LWJpdHMhIQ==}
logging:
  level:
    com.farmaid: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
