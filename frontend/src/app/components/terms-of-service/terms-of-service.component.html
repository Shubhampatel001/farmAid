<div class="page-wrapper">
  <section class="page-content">
    <div class="container terms-container">
      <h2>📜 Terms of Service – Plain and Simple</h2>
      <div class="accordion">
        @for (item of terms; track item.title) {
          <div class="accordion-item">
            <button type="button" [attr.aria-expanded]="item.open()" (click)="item.open.set(!item.open())">{{ item.title }}</button>
            @if (item.open()) {
              <div class="accordion-content">{{ item.content }}</div>
            }
          </div>
        }
      </div>
    </div>
  </section>
</div>
<app-footer />
