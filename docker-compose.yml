# Demo (no setup):    docker compose up demo           ->  http://localhost:8090   (or double-click start-demo.cmd)
# Local development:  docker compose up -d mysql       (then run backend/frontend from your IDE)
# Full stack:         docker compose --profile full up --build   ->  http://localhost:8081
#
# Values come from .env (copy .env.example). The defaults below only exist so commands work without one.
services:
  demo:
    # Self-contained demo: site + API + in-memory sample data (root Dockerfile). Resets on every restart.
    profiles: ["demo"]
    build: .
    image: farmaid-demo
    ports:
      - "8090:8080"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${DB_NAME:-farmaid}
      MYSQL_USER: ${DB_USER:-farmaid}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  backend:
    profiles: ["full"]
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-farmaid}
      DB_USER: ${DB_USER:-farmaid}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      # Required for the full stack; the backend refuses to start without it.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-300}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

  frontend:
    profiles: ["full"]
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data:
