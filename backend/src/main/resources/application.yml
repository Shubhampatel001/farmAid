spring:
  application:
    name: farmaid
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Lets local runs pick up the repo-level .env (KEY=VALUE lines) without exporting variables.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/farmaid}
    username: ${DB_USER:farmaid}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:300}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
app:
  jwt:
    # Dev-only fallback so the app starts without a .env. Override in every real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1mYXJtYWlkLWRldi1rZXktMjU2LWJpdHMhIQ==}
logging:
  level:
    com.farmaid: DEBUG

---
# Self-contained public demo: in-memory H2, demo accounts and sample data, resets on every restart.
# Used by the root Dockerfile (which also bundles the Angular site). Needs no environment variables.
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:farmaid;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=DATE,DATA,VALUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    # H2 reports MySQL LONGTEXT as VARCHAR; the schema still comes from the same Flyway migrations.
    hibernate:
      ddl-auto: none
app:
  jwt:
    # A fresh random key per start is fine: all data (and sessions) reset on restart anyway.
    secret: ${JWT_SECRET:${random.value}${random.value}}
  # Fixed on purpose: these accounts are advertised on the demo login page.
  admin:
    email: admin@farmaid.demo
    password: Admin@123
  demo:
    farmer-password: Farmer@123

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
